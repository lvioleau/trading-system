# Contract Service configuration.
#
# Values may embed ${VAR} (required — load fails if unset) or ${VAR:-default} (use the
# default when unset). Literals pass through. ${VAR} resolves from the process environment.
# The file path is the CONTRACT_SERVICE_CONFIG env var (default: ./contract-service.ini).

[contract-service]
# Connector gRPC endpoint serving the contract feed. Host defaults to localhost (override
# CONNECTOR_HOST for a remote/aliased connector); port from CONNECTOR_PORT (devenv sets it).
connector_endpoint = http://${CONNECTOR_HOST:-localhost}:${CONNECTOR_PORT:-50051}
# One delivery area, or a comma-separated list (e.g. `40, 41`) — one feed subscription,
# filtered to all of them.
delivery_area_eics = ${DELIVERY_AREA_EICS:-10YFR-RTE------C}
# Listen address for the service's own gRPC API (ContractService, health, reflection).
listen_addr        = 0.0.0.0:${CONTRACT_SERVICE_PORT:-50054}
# Postgres holding the durable contract tables (schema `reference`); the default matches
# the dev container from scripts/dev-postgres.sh.
database_url       = ${DATABASE_URL:-postgres://postgres:postgres@localhost:5433/trading}

# Feed tuning (optional, all in milliseconds). Defaults mirror the connector's own driver
# and server settings; uncomment to override.
#feed_initial_backoff_ms    = 500
#feed_max_backoff_ms        = 30000
#feed_stable_session_ms     = 30000
#feed_keepalive_interval_ms = 30000
#feed_keepalive_timeout_ms  = 20000
