# ID Executor configuration (crates/id-executor) — the intraday executor that trades each
# configured execution portfolio's gap to flat on the Nord Pool continuous intraday market:
# IOC order deltas to the PowerBot Gateway, sized by the Position Service gap and the live
# book. See docs/id-executor-implementation.md.
#
# Values may embed ${VAR} (required — load fails if unset) or ${VAR:-default} (use the default
# when unset). Literals pass through. ${VAR} resolves from the process environment. The file
# path is the ID_EXECUTOR_CONFIG env var (default: ./id-executor.ini).

[id-executor]
# The three read upstreams and the one write downstream. Hosts default to localhost (override
# the *_HOST vars for remote/aliased services); ports from the shared devenv port vars — the
# same vars each service listens on, so they can't drift.
position_endpoint  = http://${POSITION_SERVICE_HOST:-localhost}:${POSITION_SERVICE_PORT:-50053}
contract_endpoint  = http://${CONTRACT_SERVICE_HOST:-localhost}:${CONTRACT_SERVICE_PORT:-50054}
gateway_endpoint   = http://${GATEWAY_HOST:-localhost}:${GATEWAY_PORT:-50052}
connector_endpoint = http://${CONNECTOR_HOST:-localhost}:${CONNECTOR_PORT:-50051}
# The exchange stamped on every AddOrder (the gateway serves one venue).
exchange           = ${EXCHANGE:-nordpool}
# The executor's single delivery area, under its two encodings — the numeric id (the
# connector's depth-subscribe guard and the contract subscription filter) and the EIC string
# (the gateway's OrderEntry.delivery_area). Shared by every portfolio below; portfolios in a
# different area belong to a different executor.
delivery_area_eic  = ${DELIVERY_AREA_EIC:-10YFR-RTE------C}
# The execution portfolios this executor owns. A portfolio id is also the PowerBot
# portfolio id — one identifier end to end: the Position Service subscription scope, the id
# stamped on the portfolio's orders, the scope of its gateway subscriptions, and the key
# attributing its returning fills (duplicates are fatal). Each portfolio is traded by
# exactly one executor — a deployment invariant, stated here, enforced nowhere. Each must
# also be the target of a [position-service.gateway.<name>] section at this executor's
# gateway carrying the same id; nothing validates that across configs — a mismatch shows up
# as a gap that never shrinks (its fills fold elsewhere, so its orders never resolve).
portfolios         = ${ID_EXECUTOR_PORTFOLIOS:-exec-1}
# Listen address for the executor's own endpoint — health + the enable/disable admin
# (step 8); nothing is served yet.
listen_addr        = 0.0.0.0:${ID_EXECUTOR_PORT:-50073}

# Feed tuning (optional, all in milliseconds), shared by every subscription (position,
# contract, depth, gateway). Defaults mirror the services; uncomment to override.
#feed_initial_backoff_ms    = 500
#feed_max_backoff_ms        = 30000
#feed_stable_session_ms     = 30000
#feed_keepalive_interval_ms = 30000
#feed_keepalive_timeout_ms  = 20000

# Execution tuning (optional; defaults shown). Area-wide — one set for every portfolio.
# Quantities are venue-native integer kW; durations are positive millisecond counts.
# Additionally min_order_quantity_kw <= max_order_quantity_kw and
# quantity_step_kw <= min_order_quantity_kw (fatal otherwise).
#trading_cutoff_ms           = 3600000 # stop trading a contract this long before delivery start (1h)
#max_order_quantity_kw       = 10000   # per-order cap
#min_order_quantity_kw       = 100     # venue minimum; smaller gaps withheld + alarmed
#quantity_step_kw            = 100     # order quantities floored to this grid
order_cooldown_ms            = 5000    # per-(portfolio,contract) min spacing after a send
#order_rate_max              = 5       # per-(portfolio,contract) max orders per window
#order_rate_window_ms        = 10000   # ...the window that count is measured over
#global_order_rate_max       = 50      # executor-wide max orders per window
#global_order_rate_window_ms = 10000   # ...the window that count is measured over
#order_inflight_warn_ms      = 3000    # soft warn if still in flight this long (≤ resolve timeout)
#order_resolve_timeout_ms    = 10000   # in-flight resolved (alarmed) without a terminal revision
eval_log_throttle_ms         = 10000    # blocked/idle eval-snapshot cadence per (portfolio,contract)
