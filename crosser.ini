# Crosser configuration (crates/crosser) — the component that reconciles the strategy's target
# positions against the actual Position Service positions and injects the delta as transfers,
# priced at the connector's live top-of-book mid. See docs/crosser-implementation.md.
#
# Values may embed ${VAR} (required — load fails if unset) or ${VAR:-default} (use the default
# when unset). Literals pass through. ${VAR} resolves from the process environment. The file path
# is the CROSSER_CONFIG env var (default: ./crosser.ini).

[crosser]
# Strategy gRPC endpoint serving SubscribeTargets, and the strategy to subscribe to (one per
# crosser). The subscription names exactly the `portfolios` below; the strategy rejects it if it
# does not produce one of them — a fatal boot error, so a config/strategy mismatch fails fast.
# Host defaults to localhost (override STRATEGY_HOST for a remote/aliased strategy); port from
# STRATEGY_PORT — the same var the (mock) strategy listens on, so they can't drift.
strategy_endpoint  = http://${STRATEGY_HOST:-localhost}:${STRATEGY_PORT:-50071}
strategy           = ${STRATEGY:-strategy-x}
# Position Service gRPC endpoint — Subscribe (the actual-position baseline) and Transfer (the
# downstream). Port from POSITION_SERVICE_PORT, the var the service listens on.
position_endpoint  = http://${POSITION_SERVICE_HOST:-localhost}:${POSITION_SERVICE_PORT:-50053}
# nordpool-connector gRPC endpoint serving the depth stream — the live top-of-book mid every
# cross is priced at. Port from CONNECTOR_PORT, shared with contract-service's subscription.
connector_endpoint = http://${CONNECTOR_HOST:-localhost}:${CONNECTOR_PORT:-50051}
# The delivery area named in the depth subscription — a guard, not a filter: it must match the
# area the connector serves (a mismatch is rejected, fatal at boot).
delivery_area_eic  = ${DELIVERY_AREA_EIC:-10YFR-RTE------C}
# The strategy portfolios this crosser handles — one [crosser.portfolio.<name>] section each,
# naming the execution portfolio its crosses transfer into (an entry without its section is a
# fatal config error). Also exactly what is subscribed on the Position Service. The mock
# strategy produces exactly one portfolio (one strategy per portfolio), so the default names
# just that one; the subscription is rejected — fatal at boot — if the strategy does not
# produce every name here.
portfolios         = ${CROSSER_PORTFOLIOS:-strat-batt-1}
# Listen address for the crosser's own endpoint — health + the enable/disable admin (step 7);
# nothing is served yet.
listen_addr        = 0.0.0.0:${CROSSER_PORT:-50072}

# Feed tuning (optional, all in milliseconds), shared by every subscription (strategy, depth,
# Position Service). Defaults mirror the services; uncomment to override.
#feed_initial_backoff_ms    = 500
#feed_max_backoff_ms        = 30000
#feed_stable_session_ms     = 30000
#feed_keepalive_interval_ms = 30000
#feed_keepalive_timeout_ms  = 20000

# One section per entry in `portfolios`, mapping that strategy portfolio to the execution
# portfolio its crosses transfer into. The two must be distinct; several strategy portfolios may
# share one execution portfolio (a pooled book). Both must be portfolios the Position Service
# accepts — an unaccepted name surfaces as INVALID_ARGUMENT on the first transfer.

[crosser.portfolio.strat-batt-1]
execution = exec-1
