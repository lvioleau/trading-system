# PowerBot gateway configuration.
#
# Values may embed ${VAR} (required — load fails if unset) or ${VAR:-default} (use the default
# when unset). Literals pass through. ${VAR} resolves from the process environment. Secrets are
# never stored here: the file names the variable; the value is injected into the environment at
# deploy time (Secrets Manager → Terraform in prod, an env file / aws-vault in dev). The file
# path is the POWERBOT_CONFIG env var (default: ./powerbot.ini).

[gateway]
# STOMP-over-wss subscription endpoint; the api_key rides the upgrade, the STOMP host header is
# derived from this URL's host. One gateway instance per exchange.
wss_url                     = ${POWERBOT_WS_URL}
# Base REST URL (order entry + reconciliation snapshots); normalized to end in `/`.
rest_url                    = ${POWERBOT_REST_URL}
# Secret: injected as an env var, never a literal here. Used for the wss upgrade and REST auth.
api_key                     = ${POWERBOT_API_KEY}
exchange                    = ${POWERBOT_EXCHANGE:-nordpool}
# EIC delivery-area code (16 chars); scopes the contracts topic.
delivery_area_eic           = ${POWERBOT_DELIVERY_AREA:-10YDK-1--------W}
# The portfolios this gateway serves, comma-separated (at least one). Each gets its own
# ownorders/owntrades topic subscription and reconciliation sweep; order entry and the
# execution subscriptions are validated against this set. The env var may hold a list.
portfolio_ids               = ${POWERBOT_PORTFOLIO_ID}
# Whether the instance behind wss_url/rest_url is a PowerBot *shadow* instance. Shadow
# executions (our orders matching replicated market data) are reported as internal trades;
# true normalizes each onto the own-trades stream as an ordinary trade, so downstream
# consumers (Position Service, executors) need no shadow-awareness. The dev deployment
# points at the shadow instance, hence the true default; a live gateway must set
# POWERBOT_SHADOW=false.
shadow                      = ${POWERBOT_SHADOW:-true}

# Transport tunables. read_timeout is the read-loop wake cadence (keepalive + shutdown checks);
# handshake_timeout bounds each blocking read/write during the TLS + ws-upgrade handshake so a
# peer that accepts TCP then stalls can't hang a reconnect forever.
handshake_timeout_secs      = 10
read_timeout_ms             = 1000
write_timeout_secs          = 5
# Client heart-beat cadence (STOMP 1.2) and the server-silence budget before a session is stale.
heartbeat_interval_secs     = 10
heartbeat_timeout_secs      = 30

# Session backoff. connected_timeout bounds the wait for the STOMP CONNECTED frame; the backoff
# doubles from initial to max on repeated failures, resetting after a session stays up this long.
connected_timeout_secs      = 10
initial_backoff_ms          = 500
max_backoff_secs            = 30
backoff_reset_after_secs    = 60

# Reconciliation sweep: how often it re-fetches REST snapshots and evicts past-delivery entries,
# how far back the trade snapshots reach, and how long a contract's entries are retained past
# delivery_end (sized to the Position Service restart/reconcile window).
# trade_window spans the full intraday horizon (24h) so the sweep re-fetches every trade that is
# still pre-delivery — the gateway rebuilds complete live history from REST alone after a restart
# (there is no Postgres boot-fold).
reconcile_interval_secs     = 300
trade_window_secs           = 86400
eviction_grace_secs         = 3600

# Market poll: how often getStatus is re-fetched to log the full market/server status and
# export the powerbot.market.* metrics (state, order-action quota).
market_poll_interval_secs   = 60

# Contract sweep: how often findContracts is re-fetched to seed/re-baseline the contract
# tradability store the order gate checks (per-area state and trading windows; the contracts
# feed keeps it live in between).
contract_poll_interval_secs = 300

# Durable execution record in Postgres (schema `execution`, shared `trading` DB). Required — a
# blank database_url fails config load. database_url is a secret, injected as an env var.
[gateway.storage]
database_url                = ${POWERBOT_DATABASE_URL}
# How many websocket batches may await live persistence before the queue is full and batches are
# dropped (the reconciliation sweep still catches them).
persist_buffer              = 8192

[server]
# GATEWAY_PORT is the shared port variable (the same one position-service.ini's gateway
# endpoint reads), so the listen port and its subscribers cannot drift. The host is split
# out for container bridge mode, where the gateway must bind 0.0.0.0 to be reachable
# through a published port (compose.yaml sets it).
listen_addr                 = ${POWERBOT_GRPC_HOST:-127.0.0.1}:${GATEWAY_PORT:-50052}
# Per-topic broadcast capacity feeding the execution streams; a subscriber this far behind is
# dropped. max_subscribers caps concurrent execution-stream subscribers.
broadcast_capacity          = 1024
max_subscribers             = 64

# DogStatsD metrics export (schema `powerbot.*`). Always installed: DogStatsD is UDP, so with no
# agent listening the aggregated packets drop silently and local runs need no agent. A hostname
# (e.g. datadog-agent:8125) is legitimate; the exporter resolves it at install time.
[gateway.metrics]
dogstatsd_addr              = ${POWERBOT_DOGSTATSD_ADDR:-127.0.0.1:8125}
# Global tags (key:value, comma-separated) stamped on every powerbot.* series alongside the
# built-in version:. Agent-level tags apply to every series through a shared agent, so an
# app-identifying tag belongs here, on the client — this keeps the gateway's metrics distinct
# when it shares a DogStatsD agent with another app (e.g. the nordpool connector). Blank = none.
tags                        = ${POWERBOT_METRICS_TAGS:-env:dev, service:powerbot-gateway, exchange:nordpool-shadow, delivery_area:40}
