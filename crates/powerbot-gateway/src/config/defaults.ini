# Built-in defaults for unit tests only (compiled in via include_str! under cfg(test)).
# There is no Default impl on the config structs — these are the values the tests parse.
# Values are literals so the fixture is deterministic regardless of the ambient environment
# (direnv injects real POWERBOT_* vars in the dev shell); ${VAR} resolution itself is covered
# by the raw.rs unit tests. database_url keeps one ${VAR:-default} to exercise the `:-` path
# with a name guaranteed unset.

[gateway]
wss_url                     = wss://localhost/nordpool/v2/subscription
rest_url                    = https://localhost/tenant
api_key                     = test-key
exchange                    = nordpool
delivery_area_eic           = 10YDK-1--------W
portfolio_ids               = testpf
shadow                      = false
handshake_timeout_secs      = 10
read_timeout_ms             = 1000
write_timeout_secs          = 5
heartbeat_interval_secs     = 10
heartbeat_timeout_secs      = 30
connected_timeout_secs      = 10
initial_backoff_ms          = 500
max_backoff_secs            = 30
backoff_reset_after_secs    = 60
reconcile_interval_secs     = 300
trade_window_secs           = 21600
eviction_grace_secs         = 3600
market_poll_interval_secs   = 60
contract_poll_interval_secs = 300

[gateway.storage]
database_url                = ${POWERBOT_CFG_UNSET:-postgres://localhost/trading}
persist_buffer              = 8192

[server]
listen_addr                 = 127.0.0.1:50052
broadcast_capacity          = 1024
max_subscribers             = 64

[gateway.metrics]
dogstatsd_addr              = 127.0.0.1:8125
tags                        = service:powerbot-gateway
