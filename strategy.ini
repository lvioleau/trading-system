# Strategy cradle configuration (crates/strategy) — the reference StrategyService server and the
# crosser's test double. It subscribes to the Contract Service (the tradable set), the
# connector's depth stream (the strategy input's books and each target's booked mid), and the
# Position Service (the input's actual-position baseline), runs the strategy each tick — today
# the mock oscillator — and streams a target per tradable contract.
#
# Values may embed ${VAR} (required — load fails if unset) or ${VAR:-default} (use the default
# when unset). Literals pass through. ${VAR} resolves from the process environment. The file path
# is the STRATEGY_CONFIG env var (default: ./strategy.ini).

[strategy]
# This strategy's identity — logged, and what the crosser names in its subscribe request.
strategy          = ${STRATEGY:-strategy-x}
# The one portfolio this strategy produces — one strategy per portfolio, by design. A
# SubscribeTargets request naming any other portfolio is rejected (INVALID_ARGUMENT).
portfolio         = ${PORTFOLIO:-strat-batt-1}
# Listen address for the gRPC API (StrategyService, health, reflection).
listen_addr       = 0.0.0.0:${STRATEGY_PORT:-50071}

# Contract feed: subscribe to the Contract Service for one delivery area, maintain `contracts`
# tradable contracts (active and with delivery starting at least min_time_to_delivery_ms out,
# replaced as delivery nears), and oscillate each around `amplitude` — phase-shifted per
# contract (id times a coprime stride, spreading sequential venue ids across the cycle) so
# they do not all move together, quantized to 500 kW lots.
# Host defaults to localhost (override CONTRACT_SERVICE_HOST for a remote/aliased service); port
# from CONTRACT_SERVICE_PORT — the same var contract-service listens on, so they can't drift.
contract_endpoint = http://${CONTRACT_SERVICE_HOST:-localhost}:${CONTRACT_SERVICE_PORT:-50054}
# nordpool-connector gRPC endpoint serving the depth stream — the strategy input's books, and
# the live top-of-book mid booked on every emitted target (a contract with no live mid is
# withheld that tick). Port from CONNECTOR_PORT, shared with contract-service's subscription.
connector_endpoint = http://${CONNECTOR_HOST:-localhost}:${CONNECTOR_PORT:-50051}
# Position Service gRPC endpoint — the strategy input's actual-position baseline for the
# produced portfolio (no live baseline withholds the whole tick). Port from
# POSITION_SERVICE_PORT, the same var position-service listens on.
position_endpoint = http://${POSITION_SERVICE_HOST:-localhost}:${POSITION_SERVICE_PORT:-50053}
delivery_area_eic = ${DELIVERY_AREA_EIC:-10YFR-RTE------C}
contracts         = ${CONTRACTS:-20}
amplitude         = ${AMPLITUDE:-10000}   # kW; each contract oscillates within +/- this
# The strategy proper: the Python module run behind the cradle's strategy seam. The default is
# the reference mock oscillator, whose docstring is the module contract.
python            = ${STRATEGY_PYTHON:-crates/strategy/py/strategy.py}
# Optional (defaults shown):
#tick_ms          = 30000     # how often the tradable set is refreshed and each target re-sampled
#min_time_to_delivery_ms = 3600000  # only trade contracts whose delivery starts at least this far
                                     # out — no transfers inside the last hour before delivery (1h)
