# Position Service configuration.
#
# Values may embed ${VAR} (required — load fails if unset) or ${VAR:-default} (use the
# default when unset). Literals pass through. ${VAR} resolves from the process environment.
# The file path is the POSITION_SERVICE_CONFIG env var (default: ./position-service.ini).

[position-service]
# Portfolios this service accepts — the ledger's aggregation boundaries. Transfer legs and
# gateway mappings must name a member.
portfolios   = ${PORTFOLIOS}
# Order gateways whose execution streams fold into the ledger — one subscription each, one
# [position-service.gateway.<name>] section each. Empty is a transfers-only deployment.
gateways     = ${GATEWAYS:-nordpool-a}
# Listen address for the service's own gRPC API (PositionService, health, reflection).
listen_addr  = 0.0.0.0:${POSITION_SERVICE_PORT:-50053}
# Postgres holding the durable trade ledger (schema `positions`); the default matches the
# dev container from scripts/dev-postgres.sh — the `trading` database shared with
# contract-service (`reference`) and powerbot-gateway (`execution`).
database_url = ${DATABASE_URL:-postgres://postgres:postgres@localhost:5433/trading}

# Feed tuning (optional, all in milliseconds), shared by every gateway feed. Defaults
# mirror the contract-service; uncomment to override.
#feed_initial_backoff_ms    = 500
#feed_max_backoff_ms        = 30000
#feed_stable_session_ms     = 30000
feed_keepalive_interval_ms = 15000
feed_keepalive_timeout_ms  = 10000

# One section per entry in `gateways`, mapping that gateway's fills to a portfolio:
#
[position-service.gateway.nordpool-a]
# Host defaults to localhost (override GATEWAY_NORDPOOL_A_HOST for a remote/aliased gateway);
# port from GATEWAY_PORT (devenv sets it).
endpoint  = http://${GATEWAY_NORDPOOL_A_HOST:-localhost}:${GATEWAY_PORT:-50052}
portfolio = exec-1
# Our PowerBot portfolio id on this gateway — required: every subscription names its
# portfolio scope on the wire, and the gateway rejects a mismatch (fail-fast config-drift
# check). Whether the gateway points at a shadow instance is the *gateway's* config
# (powerbot.ini `shadow`); shadow executions arrive here as ordinary own-trades fills.
powerbot_portfolio_id = exec-1
